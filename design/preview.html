const chip=(status)=>`<span class="chip ${status==='예상'?'expected':status==='미확인'?'unchecked':status==='입력 시안'?'preview':'confirmed'}">${esc(status)}</span>`;
function transactions(){return [...state.drafts,...D.transactions].filter(t=>Number(t.date.slice(5,7))===state.month).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);}
function transaction(t){const type=t.kind==='수입'?'income':t.kind==='지출'?'expense':'transfer';return `<button class="transaction" data-transaction="${t.id}"><span class="icon ${type}">${icon(type)}</span><span class="desc"><span class="title">${esc(t.title)}</span><span class="meta" style="display:block">${esc(t.category)} · ${esc(t.account)}${t.isPreview?' · 입력 시안':''}</span></span><span class="amount ${type==='income'?'income-text':type==='transfer'?'transfer-text':''}">${type==='income'&&t.amount>=0?'+':''}${money(t.amount)}<span class="unit" style="font-size:9px"> 원</span></span></button>`;}
const title=(text,sub)=>`<header class="top"><div><h2>${text}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="top-actions"><button class="round-btn" data-action="add" aria-label="거래 입력">${icon('plus')}</button></div></header>`;
function home(){return homeV2();}
function future(){return `<div class="future"><header class="top"><div><span class="eyebrow">이번달 결산</span><button class="month-title" data-action="month" style="padding:7px 0 0;font-weight:750">2026년 ${state.month}월 ${icon('down')}</button></div></header><div class="hero"><div class="hero-heading">이번달 남는 돈</div><div class="hero-amount">아직 미입력</div><div class="hero-note">예정 금액은 실제 거래와 따로 관리해요.</div></div><div class="section-head"><h3>예비비 적립계획</h3></div><div class="card"><div class="card-label">${state.month}월 계획</div><div class="card-amount">200,000 <span class="unit">원</span></div><div class="info">계획은 실제적립이나 잔액에 포함하지 않아요.</div></div><button class="primary" data-action="add">첫 기록 입력하기</button><div class="section-head"><h3>입력한 시안</h3></div><div class="card list-card">${transactions().length?transactions().map(transaction).join(''):'<div class="empty-state">이 달의 기록이 없어요.</div>'}</div></div>`;}
function records(){let ts=transactions().filter(t=>[t.title,t.category,t.account,t.note].some(s=>String(s).toLowerCase().includes(state.query.toLowerCase())));if(state.recordMode==='calendar')ts=ts.filter(t=>Number(t.date.slice(8,10))===state.day);let list='',last='';for(const t of ts){const day=t.date.slice(8,10);if(day!==last){if(last)list+='</div>';list+=`<div class="date-heading">${state.month}월 ${Number(day)}일 <span>${ts.filter(x=>x.date.slice(8,10)===day).length}건</span></div><div class="card list-card">`;last=day;}list+=transaction(t);}if(last)list+='</div>';return `${title('기록',`<button data-action="month" style="padding:0;font-size:11px;color:var(--muted)">2026년 ${state.month}월 ▾</button> · ${transactions().length}건`)}<div class="segmented"><button data-recordmode="list" class="${state.recordMode==='list'?'active':''}">거래 내역</button><button data-recordmode="calendar" class="${state.recordMode==='calendar'?'active':''}">달력</button></div>${state.recordMode==='calendar'?calendar():''}<div class="search">${icon('search')}<input id="search" aria-label="거래 검색" placeholder="내용, 분류, 결제수단 검색" value="${esc(state.query)}"></div><div id="transaction-list">${list||'<div class="empty-state">찾는 기록이 없어요.<br>검색어나 날짜를 바꿔보세요.</div>'}</div>`;}
function calendar(){const start=new Date(2026,state.month-1,1).getDay();const days=new Date(2026,state.month,0).getDate();return `<div class="card calendar"><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(s=>`<div class="weekday">${s}</div>`).join('')}${'<div class="empty"></div>'.repeat(start)}${Array.from({length:days},(_,i)=>`<button data-day="${i+1}" class="${state.day===i+1?'selected':''}" aria-label="${i+1}일 기록">${i+1}${transactions().some(t=>Number(t.date.slice(8,10))===i+1)?'<i class="dot"></i>':''}</button>`).join('')}</div></div>`;}
function reserve(){const rs=D.reserves.filter(r=>state.reserveMode==='all'||r.balance>0);return `${title('예비비','계획보다 중요한 건, 실제로 모인 돈.')}<div class="card"><div class="card-label">남은 금액 · 10월 5일 기준</div><div class="card-amount">${money(D.reserve)} <span class="unit">원</span></div><div class="reserve-stats"><div><small>누적 실제적립</small><strong>${money(D.reserveAllocated)}원</strong></div><div><small>누적 사용</small><strong>${money(D.reserveUsed)}원</strong></div></div></div><div class="card"><div class="row"><span>10월 적립계획</span><span class="value">200,000원</span></div><div class="row"><span>10월 실제적립</span><span class="value">0원</span></div><div class="muted" style="font-size:10px;margin-top:9px">이번달 계획은 아직 잔액에 포함되지 않았어요.</div></div><div class="section-head"><h3>목적별 예비비</h3><span class="muted">${rs.length}개</span></div><div class="segmented"><button data-reservemode="remaining" class="${state.reserveMode==='remaining'?'active':''}">남은 자금</button><button data-reservemode="all" class="${state.reserveMode==='all'?'active':''}">전체 항목</button></div>${rs.map(r=>`<button class="purpose" data-reserve="${r.id}"><div class="purpose-head"><h4>${esc(r.title)}</h4><strong>${money(r.balance)} <span class="unit" style="font-size:10px">원</span></strong></div><div class="progress"><i style="width:${r.allocated?Math.max(0,r.balance/r.allocated*100):0}%"></i></div><div class="purpose-group"><span>${esc(r.group)}</span><span>10월 계획 ${money(r.plan)}원</span></div></button>`).join('')}<div class="info">남은 금액 = 실제적립 − 사용<br>사용한 돈은 실제로 쓴 달의 결산에 반영해요.</div>`;}
function balance(){return `${title('잔액','미래에셋 WRAP · 10월 5일 기준')}<div class="card"><div class="card-label">WRAP 총잔액</div><div class="card-amount">${money(D.wrap)} <span class="unit">원</span></div><div class="balance-bar"><i style="width:${D.living/D.wrap*100}%"></i></div><div class="legend"><span><i class="key"></i>생활비 74.6%</span><span><i class="key light"></i>목적자금 25.4%</span></div></div><div class="section-head"><h3>돈의 자리</h3><button class="text-btn" data-action="movement">내부 이동 ${icon('chevron')}</button></div><button class="purpose" data-action="living"><div class="purpose-head"><h4>생활비</h4><strong>${money(D.living)} <span class="unit" style="font-size:10px">원</span></strong></div><small style="display:block;margin-top:10px">목적을 정하지 않은 생활 자금</small></button><div class="card"><div class="row"><strong>목적자금</strong><strong>${money(D.reserve)}원</strong></div>${[['가족행사비',350000],['여행비',1400000],['상환비',300000],['경조사비',100000]].map(([s,n])=>`<button class="row" style="width:100%" data-balancepurpose="${s}"><span>${s}</span><span class="value">${money(n)}원</span></button>`).join('')}</div><div class="section-head"><h3>최근 잔액 변동</h3></div><div class="card list-card">${[D.transactions.find(t=>t.id===2367),D.transactions.find(t=>t.id===2346),D.transactions.find(t=>t.id===2333)].filter(Boolean).map(transaction).join('')}</div><div class="info">생활비와 목적자금 사이의 이동은 총잔액을 바꾸지 않아요. 외부로 보낸 돈은 총잔액에서 빠져요.</div>`;}
function render(){screen.innerHTML=({home,records,reserve,balance,settings:settingsScreen})[state.tab]();document.getElementById('tabbar').innerHTML=[['home','이번달'],['records','기록'],['reserve','예비비'],['balance','잔액'],['settings','설정']].map(([t,label])=>`<button data-tab="${t}" class="${state.tab===t?'active':''}" aria-current="${state.tab===t?'page':'false'}">${icon(t)}<span title="${esc(uiName('tab.'+t))}">${esc(uiName('tab.'+t))}</span></button>`).join('');document.querySelectorAll('.guide [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));localizeMenus();}
let previousFocus;
function sheet(heading,body){previousFocus=document.activeElement;overlay.innerHTML=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(heading)}"><div class="handle" aria-hidden="true"></div><div class="sheet-head"><h3>${esc(heading)}</h3><button class="close" data-action="close" aria-label="닫기">${icon('close')}</button></div>${body}</section></div>`;document.querySelector('.sheet .close').focus();localizeMenus();document.querySelector('.screen').inert=true;document.querySelector('#tabbar').inert=true;}
function closeSheet(){overlay.innerHTML='';screen.inert=false;document.querySelector('#tabbar').inert=false;previousFocus?.focus();}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}
function detail(id){const t=[...state.drafts,...D.transactions].find(t=>t.id===id);if(!t)return;sheet(uiName('records.detail'),`<span class="detail-date">${esc(t.date.replace('T',' '))}</span><div class="large-amount">${money(t.amount)} <span class="unit">원</span></div><div class="card">${[['내용',t.title],['종류',t.kind],['분류',t.category],['결제수단',t.account]].map(([k,v])=>`<div class="row"><span class="muted">${k}</span><span class="value">${esc(v)}</span></div>`).join('')}</div>${t.note?`<div class="info">${esc(t.note)}</div>`:''}${t.id===2333?'<div class="info">변동지출에 이미 포함된 거래예요.<br>추가 실지출로 다시 더하지 않아요.</div>':''}${t.id===2346?'<div class="info">공동계좌에 납입한 금액이에요.<br>이후 공동계좌 결제는 개인 소비로 다시 세지 않아요.</div>':''}${t.isPreview?`${chip('입력 시안')}<div class="small-spacer"></div><button class="primary" data-edit="${t.id}">수정하기</button><button class="inline-link" data-delete="${t.id}">시안 기록 삭제</button>`:'<div class="preview-message">원본에서 가져온 디자인용 스냅샷이에요.<br>실제 수정·이관 기능은 다음 구현에서 연결합니다.</div>'}`);}
function settlement(){sheet(uiName('monthly.summary'),`${chip('예상')}<p>아직 들어오지 않은 월급과 예정된 고정비가 포함되어 있어요. 남는 돈은 통장 잔액과 달라요.</p><div class="card"><div class="row"><span>월급 · 예상</span><span class="value">2,776,050원</span></div><div class="row"><span>기타수입</span><span class="value">4,180원</span></div><div class="row"><strong>총수입</strong><strong>${money(D.income)}원</strong></div></div><div class="card">${[['고정지출 · 예상 포함',1248055],['변동지출',286580],['공동계좌 적립',50000],['환급·할인 차감',-300]].map(([s,n])=>`<div class="row"><span>${s}</span><span class="value">${money(n)}원</span></div>`).join('')}<div class="row"><strong>지출·적립 합계</strong><strong>${money(D.outflow)}원</strong></div></div><div class="amount-pair"><small>예상 남는 돈</small><strong>${money(D.remaining)}원</strong></div><button class="secondary" data-action="fixed" style="margin-top:22px">고정지출 확인하기</button>`);}
function fixed(){sheet(uiName('monthly.fixed'),`<div class="muted">예상과 미확인 항목을 구분해서 관리해요.</div><div class="card" style="margin-top:16px">${D.fixed.map(t=>`<div class="row tall"><span><span class="row-title">${esc(t.title)}</span><small>${esc(t.account)}</small></span><span style="text-align:right"><span class="value">${money(t.amount)}원</span><br>${chip(t.status==='예상'?'예상':'미확인')}</span></div>`).join('')}</div>`);}
function tetris(){sheet(uiName('monthly.tetris'),`<div class="card"><div class="card-label">예상 남는 돈</div><div class="row"><span>원 단위 결산</span><strong>${money(D.remaining)}원</strong></div><div class="row"><span>테트리스 결산</span><strong>${money(D.tetrisRemaining)}원</strong></div><div class="row"><span>차이</span><strong style="color:var(--violet)">11,365원</strong></div></div><div class="section-head"><h3>지출·적립을 비교하면</h3></div><div class="card"><div class="row"><span>원 단위</span><strong>1,584,335원</strong></div><div class="row"><span>테트리스</span><strong>1,595,700원</strong></div></div><div class="section-head"><h3>하루씩 살펴보기</h3><span class="muted">1칸 = 1,000원</span></div><div class="card">${[[1,17300,18000],[2,30500,31000],[3,5000,5000],[4,112890,114000],[5,120890,123000]].map(([day,actual,tet])=>`<div class="day-comparison"><small>10월 ${day}일</small><strong>${money(actual)} <span class="muted">→</span> ${money(tet)}원</strong></div><div class="comparison-bars"><i style="width:${tet/123000*100}%"></i></div>`).join('')}</div><div class="info">테트리스는 표시 단위를 바꿔 보는 비교예요.<br>실제 거래의 원 단위 금액은 그대로 유지해요.</div>`);}
function reserveDetail(id){const r=D.reserves.find(t=>t.id===id);sheet(r.title,`<div class="card-label">남은 금액</div><div class="large-amount">${money(r.balance)} <span class="unit">원</span></div><div class="card">${[['누적 실제적립',r.allocated],['누적 사용',r.used],['10월 적립계획',r.plan]].map(([s,n])=>`<div class="row"><span>${s}</span><span class="value">${money(n)}원</span></div>`).join('')}</div>${r.date?`<div class="row"><span class="muted">예정일</span><span>${esc(r.date)}</span></div>`:''}<div class="info">${esc(r.note)}</div><p>예정일과 실제 사용일은 따로 관리해요. 미래의 계획을 사용 완료로 바꾸지 않아요.</p>`);}
function addForm(existing){state.editingId=existing?.id||null;state.formKind=existing?.kind||'지출';sheet(uiName(existing?.id?'entry.edit':'entry.add'),`<div class="segmented" id="form-types">${['지출','수입','이체'].map(k=>`<button type="button" data-formkind="${k}" class="${state.formKind===k?'active':''}">${k}</button>`).join('')}</div><form id="entry-form"><div class="amount-field"><label for="amount">금액</label><div class="amount-input"><input id="amount" name="amount" inputmode="text" placeholder="0" autocomplete="off" value="${existing?.amount??''}" required aria-describedby="form-error"><span>원</span></div></div><div class="card"><div class="field"><label for="entry-title">내용</label><input id="entry-title" name="title" placeholder="어디에 썼나요?" value="${esc(existing?.title||'')}" maxlength="80" required></div><div class="field"><label for="entry-date">날짜</label><input id="entry-date" name="date" type="date" value="${existing?.date.slice(0,10)||`2026-${state.month}-05`}" min="2026-10-01" max="2026-12-31" required></div><div class="field"><label for="entry-account">결제수단</label><select name="account" id="entry-account">${['MG+S 하나카드','롯데365카드','KB쿠팡와우','미래에셋_WRAP형CMA','CASH'].map(a=>`<option ${existing?.account===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="entry-category" id="category-label">분류</label><select name="category" id="entry-category">${['식비','문화/생활','잡화/소품/가구/생필품','기타','금융','예비비 적립','공동계좌 적립','생활비 → 여행비'].map(a=>`<option ${existing?.category===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="entry-note">메모</label><input id="entry-note" name="note" placeholder="정산이나 사용 목적을 남겨요" value="${esc(existing?.note||'')}" maxlength="200"></div></div><div class="info" id="kind-help">환급·정산금은 음수 지출로 입력할 수 있어요.</div><div class="field-error" id="form-error" role="alert"></div><button class="primary" type="submit">${existing?'수정 저장':'시안에 저장'}</button><div class="preview-message">입력 흐름을 확인하는 미리보기예요. 시안 기록은 이 화면에서만 유지되며 결산·예비비·잔액에는 반영하지 않아요.</div></form>`);if(state.formKind==='이체')setFormKind('이체');}
function setFormKind(k){state.formKind=k;document.querySelectorAll('[data-formkind]').forEach(b=>b.classList.toggle('active',b.dataset.formkind===k));document.getElementById('category-label').textContent=k==='이체'?'이동 목적':'분류';document.getElementById('kind-help').textContent=k==='이체'?'내부 목적자금 이동과 외부 송금을 구분해요. 결산에는 소비로 자동 합산하지 않아요.':k==='수입'?'월급, 용돈, 상여, 기타수입을 함께 관리해요.':'환급·정산금은 음수 지출로 입력할 수 있어요.';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.classList.contains('backdrop'))closeSheet();return;}if(b.dataset.tab){state.tab=b.dataset.tab;closeSheet();render();screen.scrollTop=0;}else if(b.dataset.transaction)detail(Number(b.dataset.transaction));else if(b.dataset.recordmode){state.recordMode=b.dataset.recordmode;render();}else if(b.dataset.day){state.day=Number(b.dataset.day);render();}else if(b.dataset.reservemode){state.reserveMode=b.dataset.reservemode;render();}else if(b.dataset.reserve)reserveDetail(Number(b.dataset.reserve));else if(b.dataset.month){state.month=Number(b.dataset.month);closeSheet();render();screen.scrollTop=0;}else if(b.dataset.formkind)setFormKind(b.dataset.formkind);else if(b.dataset.edit)addForm(state.drafts.find(t=>t.id===Number(b.dataset.edit)));else if(b.dataset.delete){state.drafts=state.drafts.filter(t=>t.id!==Number(b.dataset.delete));closeSheet();render();toast('시안 기록을 삭제했어요.');}else if(b.dataset.balancepurpose){const group=b.dataset.balancepurpose;const rs=D.reserves.filter(r=>r.group===group&&r.balance>0);sheet(group,`<div class="card">${rs.map(r=>`<button class="row" data-reserve="${r.id}" style="width:100%"><span>${esc(r.title)}</span><strong>${money(r.balance)}원</strong></button>`).join('')}</div>`);}else if(b.dataset.action){switch(b.dataset.action){case'close':closeSheet();break;case'add':addForm();break;case'settlement':settlement();break;case'fixed':fixed();break;case'tetris':tetris();break;case'month':sheet(uiName('common.month'),`<span class="muted">2026년</span><div class="month-grid">${[10,11,12].map(m=>`<button data-month="${m}" class="${state.month===m?'active':''}">${m}월<small>${m===10?'진행 중':'미입력'}</small></button>`).join('')}</div><p>이번 시안은 10월부터 시작해요. 미래 월은 실제 입력 전까지 미입력으로 표시합니다.</p>`);break;case'settings':sheet('테트리스 가계부',`<p>기존 엑셀 가계부를 iPhone으로 옮기는 첫 디자인입니다.</p><div class="card"><div class="row"><span>데이터 기준일</span><strong>2026.10.05</strong></div><div class="row"><span>디자인 버전</span><strong>02</strong></div></div><p>이번달 네 가지 지출 메뉴와 개인 설정을 살펴보세요. 이름·화면 설정은 이 기기에 저장됩니다. 새로운 입력은 시안에만 남고 새로고침하면 초기화됩니다.</p><p>실제 데이터 저장·가져오기·자동 계산은 다음 개발 단계에서 연결합니다. 앱 이름은 엑셀 파일명을 따른 작업명입니다.</p>`);break;case'movement':state.formKind='이체';addForm({kind:'이체',date:'2026-10-05',title:'',amount:'',account:'미래에셋_WRAP형CMA',category:'생활비 → 여행비'});break;case'living':sheet(uiName('balance.living'),`<div class="large-amount">${money(D.living)} <span class="unit">원</span></div><div class="card"><div class="row"><span>9월 말 생활비</span><strong>6,388,603원</strong></div><div class="row"><span>WRAP 이자</span><strong class="income-text">+4,178원</strong></div><div class="row"><span>두끼떡볶이</span><strong>−11,900원</strong></div><div class="row"><span>공동통장 납입</span><strong>−50,000원</strong></div></div><div class="info">생활비 + 목적자금 = WRAP 총잔액<br>기준일 잔액 8,480,881원과 일치해요.</div>`);break;}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(start,start);}});
document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const f=new FormData(e.target),raw=String(f.get('amount')).trim().replaceAll(',','');const error=document.getElementById('form-error');if(!/^-?\d+$/.test(raw)||!Number.isSafeInteger(Number(raw))||Math.abs(Number(raw))>9999999999){error.textContent='원 단위 정수 금액을 입력해주세요.';return;}if(state.formKind!=='지출'&&Number(raw)<0){error.textContent='수입과 이체는 0원 이상의 금액을 입력해주세요.';return;}if(!String(f.get('title')).trim()){error.textContent='내용을 입력해주세요.';return;}const record={id:state.editingId||Date.now(),date:f.get('date')+'T12:00',title:String(f.get('title')).trim(),account:f.get('account'),category:f.get('category'),amount:Number(raw),kind:state.formKind,note:f.get('note'),isPreview:true};state.drafts=state.drafts.filter(t=>t.id!==record.id);state.drafts.push(record);state.month=Number(record.date.slice(5,7));state.tab='records';state.query='';state.recordMode='list';closeSheet();render();toast('시안 기록을 저장했어요.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.innerHTML)closeSheet();if(e.key==='Tab'&&overlay.innerHTML){const controls=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
const initial=new URLSearchParams(location.search).get('tab');if(['home','records','reserve','balance','settings'].includes(initial))state.tab=initial;
render();
if(new URLSearchParams(location.search).get('sheet')==='input')addForm();

if(new URLSearchParams(location.search).get('sheet')==='cash')cashDetail();
</script>
</body></html>
